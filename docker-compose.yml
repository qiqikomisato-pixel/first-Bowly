services:
  web-server:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bowly-web-server
    ports:
      - 8080:80
    depends_on:
      - backend

  database:
    image: postgres:14-alpine3.23
    container_name: bowly-database
    shm_size: 128mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    container_name: bowly-backend
    volumes:
      - ./backend/app:/app/app
    command: "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data: